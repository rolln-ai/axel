# Local backing stores for Axel development and self-hosting.
#
#   docker compose up -d
#   DATABASE_URL=postgres://axel:axel@localhost:5432/axel ./scripts/run-migrations.sh
#   CLICKHOUSE_URL=http://localhost:8123 CLICKHOUSE_USER=axel CLICKHOUSE_PASSWORD=axel \
#     ./scripts/apply-clickhouse-schema.sh
#
# ClickHouse is optional — it backs delivery logs, usage analytics, and the
# billing rollup. The dashboard renders empty states without it.
services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: axel
      POSTGRES_PASSWORD: axel
      POSTGRES_DB: axel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axel"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    environment:
      CLICKHOUSE_USER: axel
      CLICKHOUSE_PASSWORD: axel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  chdata:
