name = "axel-router"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Queue-only worker — no HTTP endpoint needed.
workers_dev = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
# Keep the heartbeat fresh when no source events arrive.
crons = ["*/2 * * * *"]

# Inbound: consume the 16 sharded ingest queues. Cloudflare delivers each
# message exactly once per dead-letter setting and retries on msg.retry().
[[queues.consumers]]
queue = "axel-events-00"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-01"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-02"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-03"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-04"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-05"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "axel-dead-letter"

[[queues.consumers]]
queue = "axel-events-06"
max_batch_size = 25
