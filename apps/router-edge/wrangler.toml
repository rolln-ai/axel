# Outbound: fan-out destination messages.
# DELIVERY_QUEUE        → CF delivery-edge worker (HTTP, R2, S3)
# DELIVERY_NATIVE_QUEUE → Render Node service pull loop (postgres/mongodb/databricks
#                         native destinations; runs apps/delivery-service)
[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "axel-delivery"

[[queues.producers]]
binding = "DELIVERY_NATIVE_QUEUE"
queue = "axel-delivery-native"

# DELIVERY_PARQUET_QUEUE → dedicated single-instance Parquet-S3 consumer
# (the Render worker role drains it; see PARQUET_DELIVERY_QUEUE_ID in render.yaml).
# Provision the queue FIRST (`wrangler queues create axel-delivery-parquet`),
# then uncomment — `wrangler deploy` fails on a producer bound to a missing
# queue. Until then the router falls back to DELIVERY_NATIVE_QUEUE.
# [[queues.producers]]
# binding = "DELIVERY_PARQUET_QUEUE"
# queue = "axel-delivery-parquet"

[[queues.producers]]
binding = "DEAD_LETTER_QUEUE"
queue = "axel-dead-letter"

# Raw payload storage shared with the ingest worker.
[[r2_buckets]]
binding = "EVENTS_RAW"
bucket_name = "axel-events-raw"
preview_bucket_name = "axel-events-raw-preview"

# DATABASE_URL is set as a wrangler secret (NOT a vars entry).
# `wrangler secret put DATABASE_URL` from the apps/router-edge dir.

# DELIVERY_SHARED_SECRET is also a wrangler secret. Used to authenticate
# /internal/routes and /internal/heartbeat requests to the Render
# delivery-service. The same value is set as DELIVERY_SHARED_SECRET on Render.
# `wrangler secret put DELIVERY_SHARED_SECRET` from the apps/router-edge dir.

[vars]
DELIVERY_SERVICE_URL = "https://axel-delivery-native.onrender.com"
SENTRY_ENVIRONMENT = "production"

# FIFO/ordered delivery (Phase 2). Per-key serializer Durable Object — the first
# DO in this stack. Inert until call sites are wired (see src/ordering/README.md)
# and a source opts into ordered delivery; no traffic reaches it before then.
[[durable_objects.bindings]]
name = "ORDERING"
class_name = "OrderingDurableObject"

[[migrations]]
tag = "v1-ordering-do"
new_classes = ["OrderingDurableObject"]
