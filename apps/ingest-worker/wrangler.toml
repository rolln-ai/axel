name = "axel-ingest"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Production route: ingest.axelapp.ai/* → this worker.
# `custom_domain = true` makes Cloudflare auto-manage the DNS record on deploy.
routes = [
  { pattern = "ingest.axelapp.ai", custom_domain = true }
]

# R2 bucket for raw payload storage. Provisioning gated on infra approval.
[[r2_buckets]]
binding = "EVENTS_RAW"
bucket_name = "axel-events-raw"
preview_bucket_name = "axel-events-raw-preview"

# Sharded queues — declared as producers here, consumers live in apps/router.
# Provisioning gated on infra approval.
[[queues.producers]]
binding = "QUEUE_EVENTS_00"
queue = "axel-events-00"

[[queues.producers]]
binding = "QUEUE_EVENTS_01"
queue = "axel-events-01"

[[queues.producers]]
binding = "QUEUE_EVENTS_02"
queue = "axel-events-02"

[[queues.producers]]
binding = "QUEUE_EVENTS_03"
queue = "axel-events-03"

[[queues.producers]]
binding = "QUEUE_EVENTS_04"
queue = "axel-events-04"

[[queues.producers]]
binding = "QUEUE_EVENTS_05"
queue = "axel-events-05"

[[queues.producers]]
binding = "QUEUE_EVENTS_06"
queue = "axel-events-06"

[[queues.producers]]
binding = "QUEUE_EVENTS_07"
queue = "axel-events-07"

[[queues.producers]]
binding = "QUEUE_EVENTS_08"
queue = "axel-events-08"

[[queues.producers]]
binding = "QUEUE_EVENTS_09"
queue = "axel-events-09"

[[queues.producers]]
binding = "QUEUE_EVENTS_10"
queue = "axel-events-10"

[[queues.producers]]
binding = "QUEUE_EVENTS_11"
queue = "axel-events-11"

[[queues.producers]]
binding = "QUEUE_EVENTS_12"
queue = "axel-events-12"

[[queues.producers]]
binding = "QUEUE_EVENTS_13"
queue = "axel-events-13"

[[queues.producers]]
binding = "QUEUE_EVENTS_14"
queue = "axel-events-14"

[[queues.producers]]
binding = "QUEUE_EVENTS_15"
queue = "axel-events-15"

# Edge cache for source lookups (5-min positive TTL, 30s negative TTL).
# Optional — when unbound, lookupSource falls through to the upstream every call.
[[kv_namespaces]]
binding = "SOURCE_CACHE"
id = "f62a3d017f1246baa648cdc969812b5e"

[vars]
# This is the PRODUCTION [vars] block (SENTRY_ENVIRONMENT below). DEV_MODE must
# NOT live here — a hardcoded DEV_MODE = "true" lets a stray DEV_SOURCES secret
# override real source config in prod. For local dev, put DEV_MODE = "true"
# (and DEV_SOURCES) in apps/ingest-worker/.dev.vars (auto-loaded by `wrangler dev`,
# gitignored). The Phase-4 Postgres source lookup will replace dev-mode entirely.
SENTRY_ENVIRONMENT = "production"
# Heartbeat ingress for the operational view. POSTs to
# `${DELIVERY_SERVICE_URL}/internal/heartbeat` once a minute so
# /admin/health + /status can see ingest is alive. Auth header is
# DELIVERY_SHARED_SECRET (set via `wrangler secret put DELIVERY_SHARED_SECRET`)
# authenticates heartbeats. Production source-cache misses at
# POST /internal/source use the dedicated SOURCE_LOOKUP_SHARED_SECRET.
DELIVERY_SERVICE_URL = "https://axel-delivery-native.onrender.com"

# Source config secret in dev: a JSON map of source_id → { workspace_id, secret_token, status }.
# Set with: wrangler secret put DEV_SOURCES
# Admin endpoint shared secret for POST /admin/source-cache/invalidate.
# Set with: wrangler secret put ADMIN_TOKEN
# Heartbeat shared secret (same value as router-edge uses).
# Set with: wrangler secret put DELIVERY_SHARED_SECRET
# Dedicated source-lookup secret. Keep this off router-edge and delivery-edge.
# Set with: wrangler secret put SOURCE_LOOKUP_SHARED_SECRET
# Control-plane Postgres for erasure indexing and local-dev source fallback.
# Set with: wrangler secret put DATABASE_URL
# Local-dev direct-PG fallback only: AES-256-GCM source signing-secret key.
