name: Inspect route health

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Exact workspace ID containing the route
        required: true
        type: string
      route_id:
        description: Exact route ID to inspect (read only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect one route without exporting customer data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DASHBOARD_URL }}
          ROUTE_HEALTH_WORKSPACE_ID: ${{ inputs.workspace_id }}
          ROUTE_HEALTH_ROUTE_ID: ${{ inputs.route_id }}
        run: node scripts/inspect-route-health.mjs
