name: Post-merge Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: post-merge-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.repository == 'rolln-ai/axel' }}
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Wait for this SHA in production
        run: node scripts/wait-for-production-deploys.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_WAIT_TIMEOUT_MS: "3600000"
          DEPLOY_POLL_INTERVAL_MS: "15000"

      - name: Wait for operational convergence
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            body="$(curl -fsS --connect-timeout 5 --max-time 15 "${AXEL_APP_URL%/}/status" || true)"
            if grep -Fq "All systems operational" <<<"$body"; then
              echo "Production status is fully operational"
              exit 0
            fi
            echo "Production status has not converged; retrying in 15 seconds"
            sleep 15
          done
          echo "Production did not converge to fully operational within 5 minutes" >&2
          exit 1
        env:
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}

      - name: Run production smoke
        id: smoke
        continue-on-error: true
        run: bash scripts/smoke.sh
        env:
          AXEL_MARKETING_URL: ${{ vars.AXEL_MARKETING_URL || 'https://axelapp.ai' }}
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          AXEL_DELIVERY_URL: ${{ vars.AXEL_DELIVERY_URL || 'https://axel-delivery-native.onrender.com' }}
          AXEL_REQUIRE_OPERATIONAL_STATUS: "1"
          AXEL_OPS_TEST_TOKEN: ${{ secrets.OPS_TEST_TOKEN }}

      - name: Sync deploy result to Linear
        if: always()
        run: node scripts/linear-deploy-sync.mjs --status=${{ steps.smoke.outcome == 'success' && 'success' || 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

      - name: Fail on smoke failure
        if: ${{ steps.smoke.outcome != 'success' }}
        run: exit 1
