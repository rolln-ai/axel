name: Preview Deploy Smoke

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: preview-deploy-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # This is the fork-safe required check. It deliberately has no secrets and
    # does not deploy. Hosted PR previews are currently disabled; an operator
    # can stage an exact commit through the protected deployment workflow.
    name: Preview deploy smoke
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard and marketing without deployment credentials
        # The ellipsis includes workspace dependencies whose package exports
        # point at generated dist files. A clean fork checkout has no such
        # artifacts until these builds run.
        run: pnpm --filter @axel/dashboard... --filter @axel/marketing... build
