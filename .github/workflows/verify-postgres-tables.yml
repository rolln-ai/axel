name: Verify Postgres tables

# Ad-hoc verifier for "does table X exist in prod and have row Y" kinds
# of questions. Read-only — runs `to_regclass` + COUNT(*) and exits.
# Useful when triaging stale Sentry "relation X does not exist" reports
# without needing a psql shell to prod.

on:
  workflow_dispatch:
    inputs:
      tables:
        description: Comma-separated unqualified table names (e.g. `data_contracts,event_maps`)
        required: true
        default: data_contracts

concurrency:
  group: verify-postgres-tables
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build verify SQL
        env:
          TABLES_INPUT: ${{ inputs.tables }}
        run: |
          set -euo pipefail
          sql_file="$RUNNER_TEMP/verify.sql"
          # Use a DO block so each table's row-count branch is planned at
          # runtime via EXECUTE rather than at the outer query's parse
          # time. (UNION-ALL-of-CASE blew up at plan time when one table
          # didn't exist — PG validates the COUNT(*) reference even when
          # its CASE branch is unreachable.)
          #
          # Write to a file rather than pass the generated block through an
          # extra shell-quoting layer in the execution step.
          IFS=',' read -ra arr <<< "$TABLES_INPUT"
          if [ "${#arr[@]}" -eq 0 ]; then
            echo "::error::At least one table name is required."
            exit 1
          fi

          {
            printf 'BEGIN TRANSACTION READ ONLY;\nDO $$\nDECLARE n bigint;\nBEGIN\n'
            for raw_table in "${arr[@]}"; do
              t="${raw_table#"${raw_table%%[![:space:]]*}"}"
              t="${t%"${t##*[![:space:]]}"}"
              if [[ ! "$t" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::Invalid table name. Use letters, numbers, and underscores, starting with a letter or underscore." >&2
                exit 1
              fi
              printf "  IF to_regclass('public.%s') IS NOT NULL THEN\n" "$t"
              printf "    EXECUTE format('SELECT COUNT(*) FROM public.%%I', '%s') INTO n;\n" "$t"
              printf "    RAISE NOTICE '%s: exists, %% rows', n;\n" "$t"
              printf "  ELSE\n"
              printf "    RAISE NOTICE '%s: NOT FOUND';\n" "$t"
              printf "  END IF;\n"
            done
            printf 'END $$;\nCOMMIT;\n'
          } > "$sql_file"
          echo "--- sql ---"
          cat "$sql_file"
      - name: Run
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/verify.sql"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
