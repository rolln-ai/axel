name: Auto-merge Linear PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    # Keep the write-capable token unavailable to forks and untrusted authors.
    # Add future maintainers explicitly after granting repository write access.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == '10-01' }}
    runs-on: ubuntu-latest
    environment: Automation
    steps:
      - name: Enable auto-merge for Codex Linear branches
        env:
          # Enable auto-merge with a PAT/App token (secrets.AUTOMERGE_TOKEN) so
          # the resulting merge is attributed to a real identity. GitHub
          # suppresses downstream workflow runs created by GITHUB_TOKEN; a
          # PAT/App token preserves push CI and release attribution.
          # Falls back to github.token until the secret is set (current behavior,
          # no regression) — see ROL-209.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft PR; auto-merge disabled until ready for review."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "External fork PR; auto-merge disabled."
            exit 0
          fi
          if [ "$PR_AUTHOR" != "10-01" ]; then
            echo "Untrusted PR author; auto-merge disabled."
            exit 0
          fi
          if ! printf '%s\n%s\n' "$PR_TITLE" "$HEAD_REF" | grep -Eq 'ROL-[0-9]+'; then
            echo "No ROL issue key found; auto-merge disabled."
            exit 0
          fi
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^codex/rol-[0-9]+-'; then
            echo "Branch is not codex/rol-*; auto-merge disabled."
            exit 0
          fi
          if jq -e '.pull_request.labels[]?.name == "no-automerge"' "$EVENT_PATH" >/dev/null; then
            echo "no-automerge label present; auto-merge disabled."
            exit 0
          fi
          if ! gh pr merge "$PR_URL" --auto --squash --delete-branch; then
            echo "::warning::Could not enable auto-merge. It may already be enabled, or repository settings may need attention."
          fi
