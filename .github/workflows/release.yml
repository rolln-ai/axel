name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
      notes:
        description: Short release note
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.ver }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RAW="$RAW_VERSION"
          if [[ ! "$RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::dispatch version must be a semantic version such as v1.2.3"
            exit 1
          fi
          VER="${RAW#v}"
          FILE="$(cat VERSION)"
          if [[ ! "$FILE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION contains an invalid semantic version"
            exit 1
          fi
          if [ "$VER" != "$FILE" ]; then
            echo "::error::dispatch version $VER does not match the VERSION file ($FILE). Bump VERSION (scripts/release-verify.mjs --bump ...) and commit it first."
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # Runs the full deterministic suite per workspace and exits 1 if the
      # ledger is red. The runner-only ledger is retained as workflow evidence;
      # release metadata in the repository must arrive through a reviewed PR.
      - name: Release verify
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ steps.ver.outputs.ver }}
        # Release verification writes its detailed ledger to runner storage.
        # Public main remains review-only; a release workflow must never push a
        # bot-authored commit around branch protection.
        run: node scripts/release-verify.mjs --version "$RELEASE_VERSION" --notes "$RELEASE_NOTES" --out "$RUNNER_TEMP/release-ledger"

  tag:
    name: Tag release
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    needs: verify
    environment: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ needs.verify.outputs.sha }}
          body: ${{ inputs.notes }}
