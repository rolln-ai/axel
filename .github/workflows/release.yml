name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
      notes:
        description: Short release note
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          RAW="${{ inputs.version }}"
          VER="${RAW#v}"
          FILE="$(cat VERSION)"
          if [ "$VER" != "$FILE" ]; then
            echo "::error::dispatch version $VER does not match the VERSION file ($FILE). Bump VERSION (scripts/release-verify.mjs --bump ...) and commit it first."
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # Runs the full deterministic suite per workspace, writes releases/<ver>.json,
      # and exits 1 if the ledger is red — which fails this job and skips `tag`,
      # so no release is cut for a red ledger. The per-version ledger JSON is
      # gitignored (internal); only CHANGELOG.md and VERSION are committed.
      - name: Release verify
        run: node scripts/release-verify.mjs --version "${{ steps.ver.outputs.ver }}" --notes "${{ inputs.notes }}"

      - name: Commit changelog
        run: |
          git config user.name "axel-release-bot"
          git config user.email "release-bot@axelapp.ai"
          git add releases/ VERSION
          if git diff --cached --quiet; then
            echo "changelog unchanged — nothing to commit"
          else
            git commit -m "release: changelog for v${{ steps.ver.outputs.ver }}"
            git push || echo "::warning::changelog push rejected (branch protection?)"
          fi

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: verify
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.notes }}
