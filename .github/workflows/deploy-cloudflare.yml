name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reviewed release or incident change being deployed
        required: true
        type: string
      service:
        description: Worker to deploy
        required: true
        default: ingest-worker
        type: choice
        options:
          - ingest-worker
          - router-edge
          - delivery-edge

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy workers
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Mark the production mutation attempt
        id: mutation_attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Harden and verify the native delivery queue
        run: node scripts/harden-cloudflare-native-queue.mjs
        env:
          CLOUDFLARE_QUEUE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Expand-compatible schema changes must land before code that may read or
      # write them. Production environment protection reviews this job once,
      # then the migration and deploy run as one ordered operation.
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending Postgres migrations
        run: ./scripts/run-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_ACCESS_MODE: ${{ vars.DATABASE_ACCESS_MODE }}
          DATABASE_SERVICE_REQUIRE_FINAL_STATE: ${{ vars.DATABASE_SERVICE_REQUIRE_FINAL_STATE }}
          DATABASE_MIGRATION_ROLE: ${{ vars.DATABASE_MIGRATION_ROLE }}
          DATABASE_MIGRATION_LOGIN_ROLE: ${{ vars.DATABASE_MIGRATION_LOGIN_ROLE }}
          DATABASE_MIGRATION_EXISTING_LOGIN_ROLES: ${{ vars.DATABASE_MIGRATION_EXISTING_LOGIN_ROLES }}
          DATABASE_MIGRATION_OWNER_PARENT_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_PARENT_ROLES }}
          DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES }}
          DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE: ${{ vars.DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE }}
          DATABASE_CANARY_WRITER_ROLE: ${{ vars.DATABASE_CANARY_WRITER_ROLE }}
          DATABASE_RUNTIME_CAPABILITY_ROLES: ${{ vars.DATABASE_RUNTIME_CAPABILITY_ROLES }}
          DATABASE_VERIFY_CAPABILITY_ROLE: ${{ vars.DATABASE_VERIFY_CAPABILITY_ROLE }}
          DATABASE_MIGRATION_ROLE_REQUIRED: "1"

      - name: Prepare commit release in Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh prepare \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

      - name: Verify ingest source-lookup control plane
        if: ${{ inputs.service == 'ingest-worker' }}
        env:
          DELIVERY_SERVICE_URL: ${{ vars.DELIVERY_SERVICE_URL || 'https://axel-delivery-native.onrender.com' }}
          SOURCE_LOOKUP_SHARED_SECRET: ${{ secrets.SOURCE_LOOKUP_SHARED_SECRET }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
        run: |
          source_lookup_secret="${SOURCE_LOOKUP_SHARED_SECRET:-${DELIVERY_SHARED_SECRET:-}}"
          test -n "$source_lookup_secret"
          response="$(curl -fsS --connect-timeout 10 --max-time 15 -X POST \
            "${DELIVERY_SERVICE_URL%/}/internal/source" \
            -H 'content-type: application/json' \
            -H "x-axel-shared-secret: $source_lookup_secret" \
            --data '{"source_id":"__cloudflare_deploy_probe__"}')"
          RESPONSE="$response" node -e '
            const body = JSON.parse(process.env.RESPONSE || "null");
            if (!body || body.source !== null) {
              throw new Error("delivery-service /internal/source preflight returned an unexpected payload");
            }
          '

      - name: Preflight required ingest Worker secrets
        if: ${{ inputs.service == 'ingest-worker' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDERING_KEY_HMAC_SECRET: ${{ secrets.ORDERING_KEY_HMAC_SECRET }}
        run: |
          set -euo pipefail
          : "${ORDERING_KEY_HMAC_SECRET:?ORDERING_KEY_HMAC_SECRET is required}"
          if [ "${#ORDERING_KEY_HMAC_SECRET}" -lt 32 ]; then
            echo "ORDERING_KEY_HMAC_SECRET must be at least 32 characters" >&2
            exit 1
          fi
          secret_list="$(pnpm --filter @axel/ingest-worker exec wrangler secret list --format json)"
          SECRET_LIST="$secret_list" node -e '
            const entries = JSON.parse(process.env.SECRET_LIST || "null");
            const names = new Set(Array.isArray(entries) ? entries.map((entry) => entry?.name) : []);
            if (!names.has("ORDERING_KEY_HMAC_SECRET")) {
              throw new Error("Run Sync Cloudflare Runtime Secrets for ingest-worker before this deploy.");
            }
          '

      - name: Deploy ingest worker
        if: ${{ inputs.service == 'ingest-worker' }}
        run: pnpm --filter @axel/ingest-worker exec wrangler deploy --tag "$GITHUB_SHA" --message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" --upload-source-maps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Read back required ingest Worker secrets
        if: ${{ inputs.service == 'ingest-worker' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(pnpm --filter @axel/ingest-worker exec wrangler secret list --format json)"
          SECRET_LIST="$secret_list" node -e '
            const entries = JSON.parse(process.env.SECRET_LIST || "null");
            const names = new Set(Array.isArray(entries) ? entries.map((entry) => entry?.name) : []);
            if (!names.has("ORDERING_KEY_HMAC_SECRET")) {
              throw new Error("Activated ingest Worker is missing its ordering-key HMAC binding.");
            }
          '

      - name: Verify ingest source authority fence
        if: ${{ inputs.service == 'ingest-worker' }}
        env:
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          INGEST_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          : "${INGEST_ADMIN_TOKEN:?ADMIN_TOKEN is required}"
          probe_token="$(node -e 'process.stdout.write(crypto.randomUUID().replaceAll("-", ""))')"
          probe_id="__source_authority_deploy_probe__"
          curl -fsS --connect-timeout 10 --max-time 15 \
            -X POST "${AXEL_INGEST_URL%/}/admin/source-authority/fence" \
            -H 'content-type: application/json' \
            -H "x-axel-admin-token: ${INGEST_ADMIN_TOKEN}" \
            --data "{\"source_id\":\"${probe_id}\",\"fence_token\":\"${probe_token}\"}" \
            -o /dev/null
          curl -fsS --connect-timeout 10 --max-time 15 \
            -X POST "${AXEL_INGEST_URL%/}/admin/source-authority/sync" \
            -H 'content-type: application/json' \
            -H "x-axel-admin-token: ${INGEST_ADMIN_TOKEN}" \
            --data "{\"source_id\":\"${probe_id}\",\"fence_token\":\"${probe_token}\",\"source\":null}" \
            -o /dev/null

      - name: Record ingest worker deploy in Sentry
        if: ${{ inputs.service == 'ingest-worker' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            cloudflare/axel-ingest-worker \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Deploy router edge
        if: ${{ inputs.service == 'router-edge' }}
        run: pnpm --filter @axel/router-edge exec wrangler deploy --tag "$GITHUB_SHA" --message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" --upload-source-maps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record router edge deploy in Sentry
        if: ${{ inputs.service == 'router-edge' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            cloudflare/axel-router-edge \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Deploy delivery edge
        if: ${{ inputs.service == 'delivery-edge' }}
        run: pnpm --filter @axel/delivery-edge exec wrangler deploy --tag "$GITHUB_SHA" --message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" --upload-source-maps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record delivery edge deploy in Sentry
        if: ${{ inputs.service == 'delivery-edge' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            cloudflare/axel-delivery-edge \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run post-deploy smoke
        if: ${{ always() && steps.mutation_attempt.outputs.attempted == 'true' }}
        run: bash scripts/smoke.sh
        env:
          AXEL_MARKETING_URL: ${{ vars.AXEL_MARKETING_URL || 'https://axelapp.ai' }}
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          AXEL_DELIVERY_URL: ${{ vars.AXEL_DELIVERY_URL || 'https://axel-delivery-native.onrender.com' }}
          AXEL_REQUIRE_OPERATIONAL_STATUS: "1"
          AXEL_OPS_TEST_TOKEN: ${{ secrets.OPS_TEST_TOKEN }}
          AXEL_REQUIRE_SENTRY_TEST: "1"
          AXEL_REQUIRE_DELIVERY_CANARY: "1"
          AXEL_CANARY_INGEST_URL: ${{ secrets.AXEL_CANARY_INGEST_URL }}
          AXEL_CANARY_INGEST_AUTH_HEADER: ${{ secrets.AXEL_CANARY_INGEST_AUTH_HEADER }}
          AXEL_CANARY_INGEST_AUTH_VALUE: ${{ secrets.AXEL_CANARY_INGEST_AUTH_VALUE }}
          AXEL_CANARY_RECEIPT_URL: ${{ secrets.AXEL_CANARY_RECEIPT_URL }}
          AXEL_CANARY_RECEIPT_AUTH_HEADER: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_HEADER }}
          AXEL_CANARY_RECEIPT_AUTH_VALUE: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_VALUE }}
