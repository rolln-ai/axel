name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:sql
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:database

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  self-host-images:
    name: Self-host images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Validate Dockerfile and build release targets
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build --check .
          docker build --target migration --tag axel-migration:ci .
          docker build --target dashboard --tag axel-dashboard:ci \
            --build-arg NEXT_PUBLIC_AXEL_APP_URL=http://localhost:8080 \
            --build-arg NEXT_PUBLIC_AXEL_INGEST_URL=https://ingest.example.test \
            --build-arg NEXT_PUBLIC_AXEL_DELIVERY_URL=http://localhost:10000 .
          docker build --target delivery --tag axel-delivery:ci .
          bash scripts/test/self-host-dashboard-image.test.sh axel-dashboard:ci
          node scripts/test/self-host-images.integration.mjs

  visual-smoke:
    name: Visual smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm visual:smoke
      - name: Verify signed-in workspace flows
        run: pnpm test:dashboard
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-smoke-artifacts
          retention-days: 7
          path: |
            artifacts/visual-smoke
            artifacts/playwright-report
            artifacts/playwright-results
            artifacts/dashboard-report
            artifacts/dashboard-results

  postgres-schema:
    # Keep this display name aligned with the protected-branch required check.
    # The implementation below now exercises both bootstrap and incremental
    # migrations, but changing the check name would strand every pull request.
    name: Postgres schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: axel_admin
          POSTGRES_PASSWORD: axel_test
          POSTGRES_DB: axel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migration names and schema parity
        run: node scripts/check-postgres-migrations.mjs
      - run: bash scripts/test/run-migrations.test.sh
        env:
          DATABASE_ADMIN_URL: postgresql://axel_admin:axel_test@localhost:5432/axel_test
          DATABASE_URL: postgresql://axel_migration:axel_migration_test_password@localhost:5432/axel_test
          DATABASE_MIGRATION_ROLE: axel_owner
          DATABASE_MIGRATION_LOGIN_ROLE: axel_migration
          DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES: "1"
          DATABASE_MIGRATION_TEST_PASSWORD: axel_migration_test_password
          DATABASE_VERIFY_CAPABILITY_ROLE: axel_verify
          DATABASE_RUNTIME_CAPABILITY_ROLES: axel_runtime
          AXEL_MIGRATION_TEST_ALLOW_RESET: "1"

  clickhouse-analytics:
    name: ClickHouse analytics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:analytics

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Workflow expression safety
        run: node scripts/check-workflow-shell-interpolation.mjs
      - run: pnpm install --frozen-lockfile
      # Keep contributor CI available during registry outages. The release
      # verifier remains strict and rejects a missing audit response.
      - run: pnpm audit --audit-level low --ignore-registry-errors
      - name: Secret scan
        run: >-
          docker run --pull=always --rm
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --verbose

  dependency-review:
    name: Dependency review
    # GitHub's dependency-review API is unavailable for this private repo
    # without GHAS. pnpm audit still runs in CI Security; this native diff gate
    # automatically activates when the repository becomes public.
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          config-file: .github/dependency-review-config.yml
