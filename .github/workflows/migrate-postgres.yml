name: Migrate Postgres (fresh-DB bootstrap)

# Re-applies infra/postgres/schema.sql wholesale. Only for bootstrapping a
# FRESH database — on an existing database it leaves pre-existing tables (and
# their old CHECK constraints) untouched, so it is NOT a migration runner.
# For incremental changes use migrate-postgres-run.yml, which applies pending
# infra/postgres/migrations/*.sql files via the schema_migrations ledger.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Migration target
        required: true
        default: production
        type: choice
        options:
          - production
      confirm:
        description: Type apply-schema to run against DATABASE_URL
        required: true

concurrency:
  # Fresh-schema operations must not overlap any production deployment.
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply schema
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'apply-schema' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate schema checkout
        run: node scripts/check-postgres-migrations.mjs
      - name: Apply schema
        run: ./scripts/run-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_ACCESS_MODE: ${{ vars.DATABASE_ACCESS_MODE }}
          DATABASE_SERVICE_REQUIRE_FINAL_STATE: ${{ vars.DATABASE_SERVICE_REQUIRE_FINAL_STATE }}
          DATABASE_MIGRATION_ROLE: ${{ vars.DATABASE_MIGRATION_ROLE }}
          DATABASE_MIGRATION_LOGIN_ROLE: ${{ vars.DATABASE_MIGRATION_LOGIN_ROLE }}
          DATABASE_MIGRATION_EXISTING_LOGIN_ROLES: ${{ vars.DATABASE_MIGRATION_EXISTING_LOGIN_ROLES }}
          DATABASE_MIGRATION_OWNER_PARENT_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_PARENT_ROLES }}
          DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES }}
          DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE: ${{ vars.DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE }}
          DATABASE_CANARY_WRITER_ROLE: ${{ vars.DATABASE_CANARY_WRITER_ROLE }}
          DATABASE_RUNTIME_CAPABILITY_ROLES: ${{ vars.DATABASE_RUNTIME_CAPABILITY_ROLES }}
          DATABASE_VERIFY_CAPABILITY_ROLE: ${{ vars.DATABASE_VERIFY_CAPABILITY_ROLE }}
          DATABASE_MIGRATION_ROLE_REQUIRED: "1"
