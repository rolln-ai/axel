name: Repair BigQuery route

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect or apply a reviewed lossless serialization plan
        required: true
        type: choice
        options:
          - inspect
          - apply
          - reconcile
      allow_new_fields:
        description: Explicitly enable the route's Allow new fields policy when the reviewed plan requires additions
        required: false
        default: false
        type: boolean
      plan_hash:
        description: Exact plan hash returned by inspection (apply only)
        required: false
        type: string
      workspace_id:
        description: Workspace ID containing the reviewed route
        required: true
        type: string
      route_id:
        description: Active single-destination BigQuery route ID
        required: true
        type: string
      expected_updated_at:
        description: Updated timestamp returned by Inspect route health
        required: true
        type: string
      confirm_production:
        description: Type apply-reviewed-lossless-repair or reconcile-confirmed-deliveries for the selected mutation
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axel/shared build && pnpm --filter @axel/observability build
      - name: Inspect or apply the bounded lossless serialization repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DASHBOARD_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_HEALTH_WORKSPACE_ID: ${{ inputs.workspace_id }}
          ROUTE_HEALTH_ROUTE_ID: ${{ inputs.route_id }}
          BQ_REPAIR_EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          BQ_REPAIR_CONFIRM: ${{ inputs.confirm_production }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          BQ_REPAIR_ACTION: ${{ inputs.action }}
          BQ_REPAIR_ALLOW_NEW_FIELDS: ${{ inputs.allow_new_fields }}
          BQ_REPAIR_PLAN_HASH: ${{ inputs.plan_hash }}
        run: node --import tsx --conditions=react-server scripts/repair-bigquery-route.mjs
