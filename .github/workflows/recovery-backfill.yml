name: Recovery backfill

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect progress or start an audited recovery
        required: true
        type: choice
        options:
          - inspect
          - start
      since:
        description: Inclusive UTC receipt time (within seven days)
        required: false
        type: string
      until:
        description: Exclusive UTC receipt time (at least five minutes ago)
        required: false
        type: string
      workspace_id:
        description: Workspace ID containing the reviewed route
        required: true
        type: string
      route_id:
        description: Healthy single-destination route ID
        required: true
        type: string
      expected_updated_at:
        description: Updated timestamp returned by Inspect route health
        required: false
        type: string
      confirm_production:
        description: Type start-reviewed-backfill after live and retained deliveries pass
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect or start a bounded recovery backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DASHBOARD_URL }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          ROUTE_HEALTH_WORKSPACE_ID: ${{ inputs.workspace_id }}
          ROUTE_HEALTH_ROUTE_ID: ${{ inputs.route_id }}
          RECOVERY_BACKFILL_EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          RECOVERY_BACKFILL_CONFIRM: ${{ inputs.confirm_production }}
          RECOVERY_BACKFILL_ACTION: ${{ inputs.action }}
          RECOVERY_BACKFILL_SINCE: ${{ inputs.since }}
          RECOVERY_BACKFILL_UNTIL: ${{ inputs.until }}
        run: node --import tsx --conditions=react-server scripts/recovery-backfill.mjs
