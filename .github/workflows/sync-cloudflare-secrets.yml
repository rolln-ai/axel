name: Sync Cloudflare Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: Worker secrets to sync
        required: true
        default: ingest-worker
        type: choice
        options:
          - ingest-worker
          - router-edge
          - delivery-edge

concurrency:
  # Activating the staged all-secret Worker version changes production. Serialize
  # it with code deploys and migrations, then prove the runtime end to end.
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secrets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mark the production mutation attempt
        id: mutation_attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      # The database credential is intentionally excluded from this broad sync.
      # Rotate it only through the serialized, one-target workflow.
      - name: Sync ingest-worker secrets
        if: ${{ inputs.service == 'ingest-worker' }}
        run: |
          set -euo pipefail
          : "${SOURCE_LOOKUP_SHARED_SECRET:?SOURCE_LOOKUP_SHARED_SECRET is required}"
          : "${ORDERING_KEY_HMAC_SECRET:?ORDERING_KEY_HMAC_SECRET is required}"
          if [ "${#ORDERING_KEY_HMAC_SECRET}" -lt 32 ]; then
            echo "ORDERING_KEY_HMAC_SECRET must be at least 32 characters" >&2
            exit 1
          fi
          bash scripts/sync-cloudflare-secret-version.sh apps/ingest-worker \
            ADMIN_TOKEN \
            DELIVERY_SHARED_SECRET \
            SOURCE_LOOKUP_SHARED_SECRET \
            ORDERING_KEY_HMAC_SECRET \
            LEGACY_QUERY_TOKEN_SOURCES \
            CLICKHOUSE_URL \
            CLICKHOUSE_USER \
            CLICKHOUSE_PASSWORD \
            SENTRY_DSN
        env:
          AXEL_CLOUDFLARE_SECRET_VERSION_TAG: secret-sync-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          SOURCE_LOOKUP_SHARED_SECRET: ${{ secrets.SOURCE_LOOKUP_SHARED_SECRET }}
          ORDERING_KEY_HMAC_SECRET: ${{ secrets.ORDERING_KEY_HMAC_SECRET }}
          LEGACY_QUERY_TOKEN_SOURCES: ${{ secrets.LEGACY_QUERY_TOKEN_SOURCES || '{}' }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Sync router-edge secrets
        if: ${{ inputs.service == 'router-edge' }}
        run: >-
          bash scripts/sync-cloudflare-secret-version.sh apps/router-edge
          DELIVERY_SHARED_SECRET SENTRY_DSN
        env:
          AXEL_CLOUDFLARE_SECRET_VERSION_TAG: secret-sync-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Sync delivery-edge secrets
        if: ${{ inputs.service == 'delivery-edge' }}
        run: |
          bash scripts/sync-cloudflare-secret-version.sh apps/delivery-edge \
            CREDENTIALS_MASTER_KEY \
            DELIVERY_SHARED_SECRET \
            CLICKHOUSE_URL \
            CLICKHOUSE_USER \
            CLICKHOUSE_PASSWORD \
            SENTRY_DSN
        env:
          AXEL_CLOUDFLARE_SECRET_VERSION_TAG: secret-sync-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify the secret-backed runtimes
        if: ${{ always() && steps.mutation_attempt.outputs.attempted == 'true' }}
        run: bash scripts/smoke.sh
        env:
          AXEL_MARKETING_URL: ${{ vars.AXEL_MARKETING_URL || 'https://axelapp.ai' }}
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          AXEL_DELIVERY_URL: ${{ vars.AXEL_DELIVERY_URL || 'https://axel-delivery-native.onrender.com' }}
          AXEL_REQUIRE_OPERATIONAL_STATUS: "1"
          AXEL_OPS_TEST_TOKEN: ${{ secrets.OPS_TEST_TOKEN }}
          AXEL_REQUIRE_SENTRY_TEST: "1"
          AXEL_REQUIRE_DELIVERY_CANARY: "1"
          AXEL_CANARY_INGEST_URL: ${{ secrets.AXEL_CANARY_INGEST_URL }}
          AXEL_CANARY_INGEST_AUTH_HEADER: ${{ secrets.AXEL_CANARY_INGEST_AUTH_HEADER }}
          AXEL_CANARY_INGEST_AUTH_VALUE: ${{ secrets.AXEL_CANARY_INGEST_AUTH_VALUE }}
          AXEL_CANARY_RECEIPT_URL: ${{ secrets.AXEL_CANARY_RECEIPT_URL }}
          AXEL_CANARY_RECEIPT_AUTH_HEADER: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_HEADER }}
          AXEL_CANARY_RECEIPT_AUTH_VALUE: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_VALUE }}
