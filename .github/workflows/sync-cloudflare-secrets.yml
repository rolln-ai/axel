name: Sync Cloudflare Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: Worker secrets to sync
        required: true
        default: all
        type: choice
        options:
          - all
          - ingest-worker
          - router-edge
          - delivery-edge

concurrency:
  # `wrangler secret put` creates a new Worker deployment. Serialize it with
  # code deploys and migrations, then prove the resulting runtime end to end.
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secrets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sync ingest-worker secrets
        if: ${{ inputs.service == 'all' || inputs.service == 'ingest-worker' }}
        run: |
          set -euo pipefail
          put_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm --dir apps/ingest-worker exec wrangler secret put "$key"
            fi
          }
          put_secret ADMIN_TOKEN
          put_secret DATABASE_URL
          put_secret DELIVERY_SHARED_SECRET
          : "${SOURCE_LOOKUP_SHARED_SECRET:?SOURCE_LOOKUP_SHARED_SECRET is required}"
          put_secret SOURCE_LOOKUP_SHARED_SECRET
          put_secret CLICKHOUSE_URL
          put_secret CLICKHOUSE_USER
          put_secret CLICKHOUSE_PASSWORD
          put_secret SENTRY_DSN

          # Wrangler exposes names and binding types only, never secret values.
          # Confirm the dedicated credential reached the live Worker so a
          # source-cache miss cannot silently fall back to a rejected secret.
          pnpm --dir apps/ingest-worker exec wrangler secret list --format json \
            > /tmp/ingest-worker-secrets.json
          node -e '
            const entries = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(entries) || !entries.some((entry) => entry.name === "SOURCE_LOOKUP_SHARED_SECRET")) {
              throw new Error("SOURCE_LOOKUP_SHARED_SECRET is missing from the live ingest Worker");
            }
          ' /tmp/ingest-worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          SOURCE_LOOKUP_SHARED_SECRET: ${{ secrets.SOURCE_LOOKUP_SHARED_SECRET }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Sync router-edge secrets
        if: ${{ inputs.service == 'all' || inputs.service == 'router-edge' }}
        run: |
          set -euo pipefail
          printf '%s' "$DELIVERY_SHARED_SECRET" | pnpm --dir apps/router-edge exec wrangler secret put DELIVERY_SHARED_SECRET
          printf '%s' "$SENTRY_DSN" | pnpm --dir apps/router-edge exec wrangler secret put SENTRY_DSN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Sync delivery-edge secrets
        if: ${{ inputs.service == 'all' || inputs.service == 'delivery-edge' }}
        run: |
          set -euo pipefail
          put_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm --dir apps/delivery-edge exec wrangler secret put "$key"
            fi
          }
          put_secret DATABASE_URL
          put_secret CREDENTIALS_MASTER_KEY
          put_secret DELIVERY_SHARED_SECRET
          put_secret CLICKHOUSE_URL
          put_secret CLICKHOUSE_USER
          put_secret CLICKHOUSE_PASSWORD
          put_secret SENTRY_DSN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify the secret-backed runtimes
        run: bash scripts/smoke.sh
        env:
          AXEL_MARKETING_URL: ${{ vars.AXEL_MARKETING_URL || 'https://axelapp.ai' }}
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          AXEL_DELIVERY_URL: ${{ vars.AXEL_DELIVERY_URL || 'https://axel-delivery-native.onrender.com' }}
          AXEL_REQUIRE_OPERATIONAL_STATUS: "1"
          AXEL_OPS_TEST_TOKEN: ${{ secrets.OPS_TEST_TOKEN }}
          AXEL_REQUIRE_DELIVERY_CANARY: "1"
          AXEL_CANARY_INGEST_URL: ${{ secrets.AXEL_CANARY_INGEST_URL }}
          AXEL_CANARY_INGEST_AUTH_HEADER: ${{ secrets.AXEL_CANARY_INGEST_AUTH_HEADER }}
          AXEL_CANARY_INGEST_AUTH_VALUE: ${{ secrets.AXEL_CANARY_INGEST_AUTH_VALUE }}
          AXEL_CANARY_RECEIPT_URL: ${{ secrets.AXEL_CANARY_RECEIPT_URL }}
          AXEL_CANARY_RECEIPT_AUTH_HEADER: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_HEADER }}
          AXEL_CANARY_RECEIPT_AUTH_VALUE: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_VALUE }}
