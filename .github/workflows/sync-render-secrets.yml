name: Sync Render Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: Render service secrets to sync
        required: true
        default: all
        type: choice
        options:
          - all
          - delivery-service
          - pull-worker
          - delivery-workers

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Render secrets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Verify candidate delivery runtime token without leasing customer messages
        if: ${{ inputs.service == 'all' || inputs.service == 'delivery-service' || inputs.service == 'delivery-workers' }}
        run: node scripts/self-host/verify-runtime-token.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RUNTIME_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
          DELIVERY_QUEUE_NAME: axel-delivery-native
          RAW_PAYLOAD_BUCKET: axel-events-raw

      - name: Sync service env vars
        shell: bash
        run: |
          set -euo pipefail
          curl() {
            command curl --connect-timeout 10 --max-time 45 "$@"
          }

          find_service_id() {
            local name="$1"
            local matches match_count service_id
            matches="$(
              curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services?limit=100" \
                | jq -c --arg name "$name" \
                    '[.[] | (.service // .) | select(.name == $name)]'
            )"
            match_count="$(jq -r 'length' <<<"$matches")"
            if [[ "$match_count" != "1" ]]; then
              echo "expected exactly one Render service named ${name}; found ${match_count}" >&2
              return 1
            fi
            service_id="$(jq -r '.[0].id // empty' <<<"$matches")"
            if [[ ! "$service_id" =~ ^srv-[A-Za-z0-9_-]+$ ]]; then
              echo "Render returned an invalid service id for ${name}" >&2
              return 1
            fi
            printf '%s\n' "$service_id"
          }

          put_env() {
            local service_id="$1"
            local key="$2"
            local value="$3"
            jq -n --arg value "$value" '{ value: $value }' \
              | curl -fsS -X PUT \
                  -H "Authorization: Bearer ${RENDER_API_KEY}" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.render.com/v1/services/${service_id}/env-vars/${key}" \
              >/dev/null
          }

          sync_service() {
            local render_name="$1"
            local service_id
            service_id="$(find_service_id "$render_name")"
            if [ -z "$service_id" ] || [ "$service_id" = "null" ]; then
              echo "Render service not found: ${render_name}" >&2
              exit 1
            fi
            put_env "$service_id" SENTRY_DSN "$SENTRY_DSN"
            put_env "$service_id" SENTRY_ENVIRONMENT production
            if [ "$render_name" = "axel-delivery-native" ]; then
              # This legacy-named secret is the delivery runtime token: it must
              # have Queues:Edit plus R2 object read/write/delete. The workflow
              # proves both before writing it. It remains separate from the
              # Wrangler deploy token; confusing the two caused ROL-427.
              if [ -n "${CLOUDFLARE_QUEUE_API_TOKEN:-}" ]; then
                put_env "$service_id" CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
                put_env "$service_id" CLOUDFLARE_API_TOKEN "$CLOUDFLARE_QUEUE_API_TOKEN"
              else
                echo "CLOUDFLARE_QUEUE_API_TOKEN unset — leaving queue credentials on ${render_name} untouched"
              fi
            fi
            echo "synced ${render_name}"
          }

          # axel-delivery-workers (DELIVERY_ROLE=worker) is the SAME app as
          # axel-delivery-native and needs the delivery-runtime secret set. Its
          # sync:false env vars were never set, so it crash-loops on
          # `missing required env var`. Copy only the allowlisted keys through
          # the protected ephemeral runner; values are never printed. Deliberately omit
          # SOURCE_LOOKUP_SHARED_SECRET because the worker role has no HTTP
          # listener and does not need access to source signing secrets.
          WORKER_SECRET_KEYS="DELIVERY_QUEUE_ID EDGE_DELIVERY_QUEUE_ID DATABASE_URL CREDENTIALS_MASTER_KEY DELIVERY_SHARED_SECRET CLICKHOUSE_URL CLICKHOUSE_USER CLICKHOUSE_PASSWORD SENTRY_DSN"
          copy_native_secrets_to_workers() {
            local src_id dst_id env_var val
            src_id="$(find_service_id axel-delivery-native)"
            dst_id="$(find_service_id axel-delivery-workers)"
            if [ -z "$src_id" ] || [ -z "$dst_id" ] || [ "$src_id" = "null" ] || [ "$dst_id" = "null" ]; then
              echo "could not resolve native/workers service ids" >&2
              exit 1
            fi
            # Do not copy the existing native token: a worker-only run must
            # receive the same candidate token proved by the preflight above.
            : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
            : "${CLOUDFLARE_QUEUE_API_TOKEN:?CLOUDFLARE_QUEUE_API_TOKEN is required}"
            put_env "$dst_id" CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
            put_env "$dst_id" CLOUDFLARE_API_TOKEN "$CLOUDFLARE_QUEUE_API_TOKEN"
            echo "copied verified Cloudflare runtime credentials -> axel-delivery-workers"
            for key in $WORKER_SECRET_KEYS; do
              env_var="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${src_id}/env-vars/${key}")"
              val="$(printf '%s' "$env_var" | jq -r '(.envVar // .).value // empty')"
              if [ -z "$val" ] || [ "$val" = "null" ]; then
                echo "WARN: ${key} not set on axel-delivery-native — skipping" >&2
                continue
              fi
              put_env "$dst_id" "$key" "$val"
              echo "copied ${key} -> axel-delivery-workers"
            done
          }

          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "delivery-service" ]; then
            sync_service axel-delivery-native
          fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "pull-worker" ]; then
            sync_service axel-pull-worker
          fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "delivery-workers" ]; then
            copy_native_secrets_to_workers
          fi
          echo "Render secrets saved without deploying. Dispatch Deploy Render Services for the reviewed main commit."
        env:
          SERVICE: ${{ inputs.service }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_QUEUE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
