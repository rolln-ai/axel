name: Sync Render Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: Render service secrets to sync
        required: true
        default: all
        type: choice
        options:
          - all
          - delivery-service
          - pull-worker
          - delivery-workers
      deploy:
        description: Trigger deploy after syncing secrets
        required: true
        default: true
        type: boolean

concurrency:
  group: sync-render-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Render secrets
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Sync service env vars
        shell: bash
        run: |
          set -euo pipefail

          find_service_id() {
            local name="$1"
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services?limit=100" \
              | jq -r --arg name "$name" '.[] | (.service // .) | select(.name == $name) | .id' \
              | head -n 1
          }

          put_env() {
            local service_id="$1"
            local key="$2"
            local value="$3"
            jq -n --arg value "$value" '{ value: $value }' \
              | curl -fsS -X PUT \
                  -H "Authorization: Bearer ${RENDER_API_KEY}" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.render.com/v1/services/${service_id}/env-vars/${key}" \
              >/dev/null
          }

          trigger_deploy() {
            local service_id="$1"
            jq -n '{ clearCache: "do_not_clear" }' \
              | curl -fsS -X POST \
                  -H "Authorization: Bearer ${RENDER_API_KEY}" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.render.com/v1/services/${service_id}/deploys" \
              >/dev/null
          }

          # Listing queues only needs Queues:Read. The delivery runtime calls
          # messages/pull and messages/ack, which need Queues:Edit — so a
          # read-only token passes a list check and then 401s on every poll
          # (ROL-427 regression). Verify the exact two calls the runtime makes,
          # against the queue it actually drains, before writing anything to
          # Render. The pulled message is handed straight back with a
          # zero-delay retry, so a live message is leased for milliseconds.
          verify_cloudflare_queue_access() {
            local queues queue_id pull lease
            queues="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_QUEUE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?per_page=100")"
            queue_id="$(printf '%s' "$queues" \
              | jq -r '.result[]? | select(.queue_name == "axel-delivery-native") | .queue_id')"
            if [ -z "$queue_id" ] || [ "$queue_id" = "null" ]; then
              echo "queue axel-delivery-native not visible to CLOUDFLARE_QUEUE_API_TOKEN" >&2
              exit 1
            fi
            pull="$(curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_QUEUE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"batch_size":1,"visibility_timeout_ms":1000}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}/messages/pull")"
            if ! printf '%s' "$pull" | jq -e '.success == true' >/dev/null; then
              echo "CLOUDFLARE_QUEUE_API_TOKEN cannot pull from axel-delivery-native; it needs Queues:Edit" >&2
              printf '%s' "$pull" | jq -c '.errors' >&2
              exit 1
            fi
            lease="$(printf '%s' "$pull" | jq -r '.result.messages[0].lease_id // empty')"
            if [ -n "$lease" ]; then
              jq -n --arg lease "$lease" '{ retries: [{ lease_id: $lease, delay_seconds: 0 }] }' \
                | curl -fsS -X POST \
                    -H "Authorization: Bearer ${CLOUDFLARE_QUEUE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data-binary @- \
                    "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}/messages/ack" \
                | jq -e '.success == true' >/dev/null
            fi
          }

          sync_service() {
            local render_name="$1"
            local service_id
            service_id="$(find_service_id "$render_name")"
            if [ -z "$service_id" ] || [ "$service_id" = "null" ]; then
              echo "Render service not found: ${render_name}" >&2
              exit 1
            fi
            put_env "$service_id" SENTRY_DSN "$SENTRY_DSN"
            put_env "$service_id" SENTRY_ENVIRONMENT production
            if [ "$render_name" = "axel-delivery-native" ]; then
              # The native delivery service pulls and acknowledges Cloudflare
              # Queue messages over the HTTP API, so its runtime token needs
              # Queues:Edit. That is a wider grant than the Wrangler deploy
              # token carries, which is why this reads a dedicated secret
              # rather than CLOUDFLARE_API_TOKEN: syncing the deploy token here
              # is what broke queue pulls in ROL-427. When the secret is unset
              # we leave Render's hand-set credential alone.
              if [ -n "${CLOUDFLARE_QUEUE_API_TOKEN:-}" ]; then
                verify_cloudflare_queue_access
                put_env "$service_id" CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
                put_env "$service_id" CLOUDFLARE_API_TOKEN "$CLOUDFLARE_QUEUE_API_TOKEN"
              else
                echo "CLOUDFLARE_QUEUE_API_TOKEN unset — leaving queue credentials on ${render_name} untouched"
              fi
            fi
            echo "synced ${render_name}"
            if [ "$DEPLOY" = "true" ]; then
              trigger_deploy "$service_id"
              echo "triggered deploy for ${render_name}"
            fi
          }

          # axel-delivery-workers (DELIVERY_ROLE=worker) is the SAME app as
          # axel-delivery-native and needs the delivery-runtime secret set. Its
          # sync:false env vars were never set, so it crash-loops on
          # `missing required env var`. Copy the full secret set native->workers
          # via the API — values never leave Render — then redeploy. Deliberately
          # omit SOURCE_LOOKUP_SHARED_SECRET because the worker role has no HTTP
          # listener and does not need access to source signing secrets.
          WORKER_SECRET_KEYS="CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN DELIVERY_QUEUE_ID EDGE_DELIVERY_QUEUE_ID DATABASE_URL CREDENTIALS_MASTER_KEY DELIVERY_SHARED_SECRET CLICKHOUSE_URL CLICKHOUSE_USER CLICKHOUSE_PASSWORD SENTRY_DSN"
          copy_native_secrets_to_workers() {
            local src_id dst_id src_env val
            src_id="$(find_service_id axel-delivery-native)"
            dst_id="$(find_service_id axel-delivery-workers)"
            if [ -z "$src_id" ] || [ -z "$dst_id" ] || [ "$src_id" = "null" ] || [ "$dst_id" = "null" ]; then
              echo "could not resolve native/workers service ids" >&2
              exit 1
            fi
            src_env="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${src_id}/env-vars?limit=100")"
            for key in $WORKER_SECRET_KEYS; do
              val="$(printf '%s' "$src_env" | jq -r --arg k "$key" '.[] | (.envVar // .) | select(.key==$k) | .value')"
              if [ -z "$val" ] || [ "$val" = "null" ]; then
                echo "WARN: ${key} not set on axel-delivery-native — skipping" >&2
                continue
              fi
              put_env "$dst_id" "$key" "$val"
              echo "copied ${key} -> axel-delivery-workers"
            done
            if [ "$DEPLOY" = "true" ]; then
              trigger_deploy "$dst_id"
              echo "triggered deploy for axel-delivery-workers"
            fi
          }

          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "delivery-service" ]; then
            sync_service axel-delivery-native
          fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "pull-worker" ]; then
            sync_service axel-pull-worker
          fi
          if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "delivery-workers" ]; then
            copy_native_secrets_to_workers
          fi
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOY: ${{ inputs.deploy }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_QUEUE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
