name: Sync Render Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: Exact Render service whose reviewed runtime secrets will be saved
        required: true
        default: axel-delivery-native
        type: choice
        options:
          - axel-delivery-native
          - axel-delivery-workers
          - axel-pull-worker
      confirm_production:
        description: Type save-reviewed-production after reviewing the exact target
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Save one Render secret profile
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
    permissions:
      contents: read
    steps:
      - name: Require explicit production confirmation
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
        run: test "$PRODUCTION_CONFIRMATION" = "save-reviewed-production"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Mark the production mutation attempt
        id: mutation_attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Verify the candidate delivery runtime token without leasing customer messages
        if: ${{ inputs.service == 'axel-delivery-native' || inputs.service == 'axel-delivery-workers' }}
        run: node scripts/self-host/verify-runtime-token.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RUNTIME_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
          DELIVERY_QUEUE_ID: ${{ secrets.DELIVERY_QUEUE_ID }}
          RAW_PAYLOAD_BUCKET: axel-events-raw

      # Each mutually exclusive step receives only its target's reviewed
      # protected inputs. The helper discovers every provider page before one
      # bulk replacement, preserves unrelated direct variables, and reads the
      # complete result back. It never requests a Render deploy.
      - name: Save native-delivery secrets atomically
        if: ${{ inputs.service == 'axel-delivery-native' }}
        run: node scripts/sync-render-runtime-secrets.mjs
        env:
          RENDER_SERVICE_NAME: axel-delivery-native
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_QUEUE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
          DELIVERY_QUEUE_ID: ${{ secrets.DELIVERY_QUEUE_ID }}
          EDGE_DELIVERY_QUEUE_ID: ${{ secrets.EDGE_DELIVERY_QUEUE_ID }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          DELIVERY_SHARED_SECRET_PREVIOUS: ${{ secrets.DELIVERY_SHARED_SECRET_PREVIOUS }}
          SOURCE_LOOKUP_SHARED_SECRET: ${{ secrets.SOURCE_LOOKUP_SHARED_SECRET }}
          SOURCE_LOOKUP_SHARED_SECRET_PREVIOUS: ${{ secrets.SOURCE_LOOKUP_SHARED_SECRET_PREVIOUS }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Save delivery-worker secrets atomically
        if: ${{ inputs.service == 'axel-delivery-workers' }}
        run: node scripts/sync-render-runtime-secrets.mjs
        env:
          RENDER_SERVICE_NAME: axel-delivery-workers
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_QUEUE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_API_TOKEN }}
          DELIVERY_QUEUE_ID: ${{ secrets.DELIVERY_QUEUE_ID }}
          EDGE_DELIVERY_QUEUE_ID: ${{ secrets.EDGE_DELIVERY_QUEUE_ID }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          DELIVERY_SHARED_SECRET: ${{ secrets.DELIVERY_SHARED_SECRET }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Save pull-worker secrets atomically
        if: ${{ inputs.service == 'axel-pull-worker' }}
        run: node scripts/sync-render-runtime-secrets.mjs
        env:
          RENDER_SERVICE_NAME: axel-pull-worker
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Record save-only completion
        if: ${{ steps.mutation_attempt.outputs.attempted == 'true' }}
        run: echo "Secrets were saved only. Dispatch Deploy Render Services for the reviewed main commit."
