name: Recover array-collapse route

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Workspace ID containing the reviewed route
        required: true
        type: string
      route_id:
        description: Errored single-destination route ID
        required: true
        type: string
      expected_updated_at:
        description: Updated timestamp returned by Inspect route health
        required: true
        type: string
      confirm_production:
        description: Type resume-reviewed-route after deploying the engine fix to live and replay routers
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axel/shared build
      - name: Validate retained failures, resume, and enqueue audited replays
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DASHBOARD_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_HEALTH_WORKSPACE_ID: ${{ inputs.workspace_id }}
          ROUTE_HEALTH_ROUTE_ID: ${{ inputs.route_id }}
          ROUTE_RECOVERY_EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          ROUTE_RECOVERY_CONFIRM: ${{ inputs.confirm_production }}
        run: node --import tsx --conditions=react-server scripts/recover-array-collapse-route.mjs
