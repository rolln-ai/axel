name: Linear PR Sync

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-pr-sync-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Linear PR sync
    # pull_request_target can read repository secrets. Never let a fork PR
    # cause writes to the private Linear workspace, even though this job checks
    # out the protected default branch rather than the proposed branch.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Sync PR to Linear
        run: node scripts/linear-pr-sync.mjs
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # linear.config.json is gitignored (private workspace IDs); CI gets
          # it from this repo variable. Absent → the script skips cleanly.
          LINEAR_CONFIG_JSON: ${{ vars.LINEAR_CONFIG_JSON }}
