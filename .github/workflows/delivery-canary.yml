name: Production Delivery Canary

on:
  schedule:
    # Best-effort fallback only. The authoritative 15-minute cadence runs in
    # the singleton axel-delivery-workers process because GitHub scheduled this
    # workflow zero times during the 2026-08-27 production rehearsal.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: production-delivery-canary
  queue: max
  cancel-in-progress: false

jobs:
  canary:
    name: Ingest to native destination
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Unattended monitoring must not share the reviewer-gated deployment
    # environment. This environment holds only canary and monitoring secrets.
    environment: Monitoring
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Prove production delivery
        run: node scripts/delivery-canary.mjs
        env:
          AXEL_CANARY_INGEST_URL: ${{ secrets.AXEL_CANARY_INGEST_URL }}
          AXEL_CANARY_INGEST_AUTH_HEADER: ${{ secrets.AXEL_CANARY_INGEST_AUTH_HEADER }}
          AXEL_CANARY_INGEST_AUTH_VALUE: ${{ secrets.AXEL_CANARY_INGEST_AUTH_VALUE }}
          AXEL_CANARY_RECEIPT_URL: ${{ secrets.AXEL_CANARY_RECEIPT_URL }}
          AXEL_CANARY_RECEIPT_AUTH_HEADER: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_HEADER }}
          AXEL_CANARY_RECEIPT_AUTH_VALUE: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_VALUE }}
          AXEL_CANARY_TIMEOUT_MS: "180000"
          AXEL_CANARY_POLL_INTERVAL_MS: "5000"

  soak-candidate:
    name: Verify active observation candidate
    # Monitoring always runs. An active release observation separately fails
    # on main drift, without suppressing the delivery proof above.
    if: ${{ github.ref == 'refs/heads/main' && vars.AXEL_SOAK_CANDIDATE_SHA != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require the pinned soak candidate
        env:
          AXEL_SOAK_CANDIDATE_SHA: ${{ vars.AXEL_SOAK_CANDIDATE_SHA }}
        run: |
          if ! test "${AXEL_SOAK_CANDIDATE_SHA}" = "${GITHUB_SHA}"; then
            echo "::error::Main changed during the active release observation. Review and restart the observation window."
            exit 1
          fi
