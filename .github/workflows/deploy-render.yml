name: Deploy Render Services

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reviewed release or incident change being deployed
        required: true
        type: string
      service:
        description: Render service to deploy
        required: true
        default: axel-delivery-native
        type: choice
        options:
          - axel-delivery-native
          - axel-delivery-workers
          - axel-pull-worker
      confirm_production:
        description: Type deploy-reviewed-production after reviewing the exact main commit and target
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require the protected main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Require explicit production confirmation
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
        run: test "$PRODUCTION_CONFIRMATION" = "deploy-reviewed-production"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Deploy Render services
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    needs: verify
    environment: Production
    timeout-minutes: 150
    env:
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Mark the production mutation attempt
        id: mutation_attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Disable and verify Render git auto-deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_NAME: ${{ inputs.service }}
        run: bash scripts/harden-render-auto-deploy.sh "$RENDER_SERVICE_NAME"

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending Postgres migrations
        run: ./scripts/run-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_ACCESS_MODE: ${{ vars.DATABASE_ACCESS_MODE }}
          DATABASE_SERVICE_REQUIRE_FINAL_STATE: ${{ vars.DATABASE_SERVICE_REQUIRE_FINAL_STATE }}
          DATABASE_MIGRATION_ROLE: ${{ vars.DATABASE_MIGRATION_ROLE }}
          DATABASE_MIGRATION_LOGIN_ROLE: ${{ vars.DATABASE_MIGRATION_LOGIN_ROLE }}
          DATABASE_MIGRATION_EXISTING_LOGIN_ROLES: ${{ vars.DATABASE_MIGRATION_EXISTING_LOGIN_ROLES }}
          DATABASE_MIGRATION_OWNER_PARENT_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_PARENT_ROLES }}
          DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES: ${{ vars.DATABASE_MIGRATION_OWNER_CAN_CREATE_ROLES }}
          DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE: ${{ vars.DATABASE_TRANSITIONAL_OWNER_LOGIN_ROLE }}
          DATABASE_CANARY_WRITER_ROLE: ${{ vars.DATABASE_CANARY_WRITER_ROLE }}
          DATABASE_RUNTIME_CAPABILITY_ROLES: ${{ vars.DATABASE_RUNTIME_CAPABILITY_ROLES }}
          DATABASE_VERIFY_CAPABILITY_ROLE: ${{ vars.DATABASE_VERIFY_CAPABILITY_ROLE }}
          DATABASE_MIGRATION_ROLE_REQUIRED: "1"

      - name: Prepare commit release in Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh prepare \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

      - name: Save and verify the selected Render Node version
        if: >-
          ${{ inputs.service == 'axel-delivery-native' ||
              inputs.service == 'axel-delivery-workers' ||
              inputs.service == 'axel-pull-worker' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_NAME: ${{ inputs.service }}
        run: node scripts/sync-render-node-version.mjs

      - name: Deploy axel-delivery-native
        if: ${{ inputs.service == 'axel-delivery-native' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/deploy-render-service.sh axel-delivery-native "$GITHUB_SHA"

      - name: Record axel-delivery-native deploy in Sentry
        if: ${{ inputs.service == 'axel-delivery-native' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            render/axel-delivery-native \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Deploy axel-delivery-workers
        if: ${{ inputs.service == 'axel-delivery-workers' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/deploy-render-service.sh axel-delivery-workers "$GITHUB_SHA"

      - name: Record axel-delivery-workers deploy in Sentry
        if: ${{ inputs.service == 'axel-delivery-workers' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            render/axel-delivery-workers \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Deploy axel-pull-worker
        if: ${{ inputs.service == 'axel-pull-worker' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/deploy-render-service.sh axel-pull-worker "$GITHUB_SHA"

      - name: Record axel-pull-worker deploy in Sentry
        if: ${{ inputs.service == 'axel-pull-worker' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: rolln
          SENTRY_PROJECT: javascript
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          bash scripts/sentry-release-deploy.sh record \
            render/axel-pull-worker \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run post-deploy smoke
        if: ${{ always() && steps.mutation_attempt.outputs.attempted == 'true' }}
        run: bash scripts/smoke.sh
        env:
          AXEL_MARKETING_URL: ${{ vars.AXEL_MARKETING_URL || 'https://axelapp.ai' }}
          AXEL_APP_URL: ${{ vars.AXEL_APP_URL || 'https://app.axelapp.ai' }}
          AXEL_INGEST_URL: ${{ vars.AXEL_INGEST_URL || 'https://ingest.axelapp.ai' }}
          AXEL_DELIVERY_URL: ${{ vars.AXEL_DELIVERY_URL || 'https://axel-delivery-native.onrender.com' }}
          AXEL_REQUIRE_OPERATIONAL_STATUS: "1"
          AXEL_OPS_TEST_TOKEN: ${{ secrets.OPS_TEST_TOKEN }}
          AXEL_REQUIRE_SENTRY_TEST: "1"
          AXEL_REQUIRE_DELIVERY_CANARY: "1"
          AXEL_CANARY_INGEST_URL: ${{ secrets.AXEL_CANARY_INGEST_URL }}
          AXEL_CANARY_INGEST_AUTH_HEADER: ${{ secrets.AXEL_CANARY_INGEST_AUTH_HEADER }}
          AXEL_CANARY_INGEST_AUTH_VALUE: ${{ secrets.AXEL_CANARY_INGEST_AUTH_VALUE }}
          AXEL_CANARY_RECEIPT_URL: ${{ secrets.AXEL_CANARY_RECEIPT_URL }}
          AXEL_CANARY_RECEIPT_AUTH_HEADER: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_HEADER }}
          AXEL_CANARY_RECEIPT_AUTH_VALUE: ${{ secrets.AXEL_CANARY_RECEIPT_AUTH_VALUE }}
