name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "24 8 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # Private repositories without GitHub Advanced Security cannot upload
    # CodeQL results. Keep the workflow ready for the public transition while
    # the always-on CI Security job runs audit + Gitleaks in private mode.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
