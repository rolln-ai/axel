name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and where Axel falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Rough idea of the change — API, CLI, UI, connector. Large changes should start here before a PR (see CONTRIBUTING.md).
    validations:
      required: false
