name: axel-selfhost

x-control-plane-env: &control-plane-env
  AXEL_DEPLOYMENT_MODE: self-hosted
  # The small profile omits ClickHouse and the subject-to-event index. The
  # dashboard uses this capability marker to disable controls that would only
  # change configuration without deleting the corresponding R2 bytes.
  AXEL_SELF_HOST_PROFILE: small
  DATABASE_POOL_MAX: "10"
  CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY}
  INGEST_ADMIN_TOKEN: ${INGEST_ADMIN_TOKEN}
  AXEL_INGEST_URL: ${NEXT_PUBLIC_AXEL_INGEST_URL}
  AXEL_APP_URL: ${AXEL_PUBLIC_URL}
  AXEL_DELIVERY_URL: ${AXEL_DELIVERY_PUBLIC_URL}
  NEXT_PUBLIC_AXEL_INGEST_URL: ${NEXT_PUBLIC_AXEL_INGEST_URL}
  NEXT_PUBLIC_AXEL_APP_URL: ${AXEL_PUBLIC_URL}
  NEXT_PUBLIC_AXEL_DELIVERY_URL: ${AXEL_DELIVERY_PUBLIC_URL}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
  RAW_PAYLOAD_BUCKET: ${RAW_PAYLOAD_BUCKET}

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: axel
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: axel
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - selfhost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axel -d axel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    image: axel-selfhost-migration:local
    build:
      context: .
      target: migration
    restart: "no"
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    working_dir: /app
    command: ["bash", "/app/scripts/self-host/run-database-setup.sh"]
    environment:
      DATABASE_ADMIN_URL: postgresql://axel:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/axel?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://axel_migration:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/axel?sslmode=disable
      DATABASE_DASHBOARD_URL: postgresql://axel_dashboard_app:${POSTGRES_DASHBOARD_PASSWORD:?POSTGRES_DASHBOARD_PASSWORD is required}@postgres:5432/axel?sslmode=disable
      DATABASE_DELIVERY_URL: postgresql://axel_delivery_app:${POSTGRES_DELIVERY_PASSWORD:?POSTGRES_DELIVERY_PASSWORD is required}@postgres:5432/axel?sslmode=disable
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  dashboard:
    image: axel-selfhost-dashboard:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    build:
      context: .
      target: dashboard
      args:
        NEXT_PUBLIC_AXEL_APP_URL: ${AXEL_PUBLIC_URL}
        NEXT_PUBLIC_AXEL_INGEST_URL: ${NEXT_PUBLIC_AXEL_INGEST_URL}
        NEXT_PUBLIC_AXEL_DELIVERY_URL: ${AXEL_DELIVERY_PUBLIC_URL}
    environment:
      <<: *control-plane-env
      DATABASE_URL: postgresql://axel_dashboard_app:${POSTGRES_DASHBOARD_PASSWORD:?POSTGRES_DASHBOARD_PASSWORD is required}@postgres:5432/axel?sslmode=disable
      # Dashboard code deliberately does not read CLOUDFLARE_API_TOKEN, so a
      # provisioning/Worker-deployment token cannot be used accidentally.
      CLOUDFLARE_R2_API_TOKEN: ${CLOUDFLARE_RUNTIME_API_TOKEN:?CLOUDFLARE_RUNTIME_API_TOKEN is required}
      CRON_SECRET: ${CRON_SECRET}
      INGEST_ADMIN_URL: ${NEXT_PUBLIC_AXEL_INGEST_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]

  delivery:
    image: axel-selfhost-delivery:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Allow active connector calls and the Parquet drain to finish on upgrades.
    stop_grace_period: 7m
    build:
      context: .
      target: delivery
    environment:
      <<: *control-plane-env
      DATABASE_URL: postgresql://axel_delivery_app:${POSTGRES_DELIVERY_PASSWORD:?POSTGRES_DELIVERY_PASSWORD is required}@postgres:5432/axel?sslmode=disable
      # The delivery service needs Queue plus R2 runtime access. This legacy
      # variable name is confined to the delivery container.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_RUNTIME_API_TOKEN:?CLOUDFLARE_RUNTIME_API_TOKEN is required}
      PORT: "10000"
      DELIVERY_ROLE: all
      DELIVERY_SHARED_SECRET: ${DELIVERY_SHARED_SECRET}
      DELIVERY_SHARED_SECRET_PREVIOUS: ${DELIVERY_SHARED_SECRET_PREVIOUS:-}
      SOURCE_LOOKUP_SHARED_SECRET: ${SOURCE_LOOKUP_SHARED_SECRET}
      SOURCE_LOOKUP_SHARED_SECRET_PREVIOUS: ${SOURCE_LOOKUP_SHARED_SECRET_PREVIOUS:-}
      DELIVERY_QUEUE_ID: ${DELIVERY_QUEUE_ID}
      EDGE_DELIVERY_QUEUE_ID: ${DELIVERY_QUEUE_ID}
      INGEST_ADMIN_TOKEN: ${INGEST_ADMIN_TOKEN}
      POLL_BATCH_SIZE: "25"
      # Empty HTTP pulls are billable Queue reads. Back off while idle so the
      # Cloudflare Free allowance is not exhausted by polling alone.
      POLL_MAX_IDLE_INTERVAL_MS: "60000"
      MAX_CONCURRENT_DELIVERIES: "8"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]

  cron:
    image: axel-selfhost-delivery:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command: ["node", "/app/scripts/self-host/cron.mjs"]
    environment:
      DASHBOARD_INTERNAL_URL: http://dashboard:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      AXEL_SITE_ADDRESS: ${AXEL_SITE_ADDRESS}
    # The core file exposes only the loopback development listener. The helper
    # adds infra/self-host/docker-compose.public.yml for public-domain installs.
    ports:
      - "${AXEL_LOCAL_BIND_ADDRESS:-127.0.0.1}:${AXEL_LOCAL_PORT:-8080}:8080"
    volumes:
      - ./infra/self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - selfhost_caddy_data:/data
      - selfhost_caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
      delivery:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  selfhost_pgdata:
  selfhost_caddy_data:
  selfhost_caddy_config:
